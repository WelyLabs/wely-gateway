name: CD
on:
  workflow_dispatch:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: string
        default: 'dev'
  workflow_call:
    inputs:
      image_tag:
        description: 'Docker image tag to deploy'
        required: true
        type: string
      environment:
        description: 'Target environment'
        required: true
        type: string

jobs:
  update-infra:
    name: Update Infra Manifest
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Infra Repo
        uses: actions/checkout@v4
        with:
          repository: WelyLabs/wely-gitops-infra
          token: ${{ secrets.INFRA_REPO_TOKEN }}
          path: infra

      # Seven repositories deploy into this one branch, so several runs reach it at the same
      # time. The previous version did `git add && git commit && git push` once: whichever run
      # arrived last had its push rejected as a non-fast-forward, the job failed, and the image
      # tag it meant to set stayed stale — with every test green, which is the part that makes it
      # easy to miss. A `concurrency` group cannot fix this: those are scoped per repository, and
      # the contending runs are in seven different ones.
      #
      # So: reset onto the current remote, reapply the tag, push, and retry on rejection. Each
      # service edits a different image entry, so the contention is on the ref and never on the
      # content — replaying the edit on top of whatever the other runs wrote always converges.
      - name: Set Image Tag and Push
        run: |
          cd infra
          git config user.name "github-actions"
          git config user.email "actions@github.com"

          for attempt in 1 2 3 4 5; do
            ( cd "overlays/${{ inputs.environment }}" \
              && kustomize edit set image \
                   ghcr.io/welylabs/wely-gateway=ghcr.io/welylabs/wely-gateway:${{ inputs.image_tag }} )

            if [ -z "$(git status --porcelain)" ]; then
              echo "Already at ${{ inputs.image_tag }}; nothing to push."
              exit 0
            fi

            git add "overlays/${{ inputs.environment }}/kustomization.yaml"
            git commit -m "deploy(${{ inputs.environment }}): update wely-gateway to ${{ inputs.image_tag }}"

            if git push; then
              echo "Pushed on attempt $attempt."
              exit 0
            fi

            echo "Push rejected on attempt $attempt — another run pushed first. Replaying."
            git fetch origin main
            git reset --hard origin/main
            sleep $(( RANDOM % 5 + attempt * 2 ))
          done

          echo "::error::Could not push the wely-gateway image tag after 5 attempts."
          exit 1

spring.application.name=gateway-test
server.port=0

spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:9999/realms/test
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=http://localhost:9999/realms/test/protocol/openid-connect/certs
users.api.url=http://localhost:9999
social.api.url=http://localhost:9999
chat.api.url=http://localhost:9999
chat.rsocket.url=ws://localhost:9999
events.api.url=http://localhost:9999

cors.allowed.origin=http://localhost:4200

# No Redis under test. The rate limiter fails open, which is what makes the routing
# tests meaningful without a broker — and is itself asserted in RateLimiterConfigTest.
spring.data.redis.host=localhost
spring.data.redis.port=6379

# A breaker that trips on the first failure, so a test does not have to send ten
# requests to observe an open circuit.
resilience4j.circuitbreaker.configs.default.sliding-window-size=1
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=1
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.timelimiter.configs.default.timeout-duration=2s

# OpenApiConfigTest asserts the specification answers; the production default is off.
springdoc.api-docs.enabled=true
springdoc.swagger-ui.enabled=true

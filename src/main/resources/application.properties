spring.application.name=gateway
server.port=8081

# Production/Base configuration (values injected by Kube or env)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}
users.api.url=${USERS_API_URL}
social.api.url=${SOCIAL_API_URL}
chat.api.url=${CHAT_API_URL}
chat.rsocket.url=${CHAT_RSOCKET_URL}
events.api.url=${EVENTS_API_URL}
notifications.api.url=${NOTIFICATIONS_API_URL}

# --- Resilience ------------------------------------------------------------
# Redis holds the rate-limit counters. An outage here does not block traffic:
# RedisRateLimiter catches the failure and lets the request through, logging it.
# Worth an alert, not worth a hard dependency.
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}
spring.data.redis.timeout=2s

# Per-caller quota, keyed on the JWT subject. 20 req/s sustained with a burst of 40
# is well above what the frontend generates and well below what a loop generates.
gateway.rate-limit.replenish-rate=${RATE_LIMIT_REPLENISH_RATE:20}
gateway.rate-limit.burst-capacity=${RATE_LIMIT_BURST_CAPACITY:40}

# Circuit breakers, one instance per route. The sliding window counts calls rather
# than time, because traffic here is low enough that a time window can close on a
# sample of two. 10 calls with half failing is a service that is down, not noisy.
resilience4j.circuitbreaker.configs.default.sliding-window-type=COUNT_BASED
resilience4j.circuitbreaker.configs.default.sliding-window-size=10
resilience4j.circuitbreaker.configs.default.minimum-number-of-calls=5
resilience4j.circuitbreaker.configs.default.failure-rate-threshold=50
resilience4j.circuitbreaker.configs.default.wait-duration-in-open-state=10s
resilience4j.circuitbreaker.configs.default.permitted-number-of-calls-in-half-open-state=3
resilience4j.circuitbreaker.configs.default.automatic-transition-from-open-to-half-open-enabled=true

# A slow service is a failing service: without this, a downstream that accepts the
# connection and never answers holds a gateway thread until the client gives up,
# and the breaker never sees a failure to count.
resilience4j.timelimiter.configs.default.timeout-duration=10s

# CORS allowed origin (injected by environment)
cors.allowed.origin=${CORS_ALLOWED_ORIGIN:https://web.welylabs.app}

# Production levels. The DEBUG settings that used to live here logged every request
# the gateway proxied, headers included, at a cost paid on every call. Raise them
# temporarily through an environment variable when a route needs investigating:
#   LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY=DEBUG
logging.level.root=INFO
logging.level.com.calendar.gateway=INFO
logging.level.reactor.netty=WARN
logging.level.org.springframework.cloud.gateway=INFO

# Errors answer our RFC 7807 problem (code, requestId) through exception/GlobalErrorHandler, a
# WebExceptionHandler. spring.webflux.problemdetails.enabled is deliberately NOT set: it registers
# Boot's ProblemDetailsExceptionHandler, which since Spring 6 also handles dispatch errors such as
# "no route matched" — and answered them in Spring's shape, without code or requestId, before our
# handler could see them (shown by GlobalErrorHandlerTest).

# --- Actuator ---------------------------------------------------------------
# Actuator lives on a management port of its own, 9081. The main port, 8081, is the one the
# Cloudflare tunnel and wely-web's nginx reach, and the tunnel's path rules live in Cloudflare,
# not in a repository: anything served on 8081 may be public, so 8081 serves no /actuator at all.
# 9081 is safe to serve without a token because nothing outside the pod reaches it except the
# scraper: it is not a port of wely-gateway-service (8081 only), the tunnel and nginx target that
# Service, and the allow-gateway NetworkPolicy admits only wely-prometheus on 9081. On 9081 the
# gateway routes nothing (RoutePredicateHandlerMapping skips the management port).
management.server.port=${MANAGEMENT_SERVER_PORT:9081}

# health, info, and the metrics for the scrape (wely.errors.technical, wely.gateway.fallbacks,
# the breakers' own). Everything else — env, beans, heapdump, loggers — stays off.
management.endpoints.web.exposure.include=health,info,prometheus

# Latency histogram, as in every service: a few fixed buckets rather than
# percentiles-histogram, which would publish ~70 buckets per series on a Raspberry Pi.
# http.server.requests is the gateway's request timer: it times every exchange, proxied ones
# included (their uri tag is UNKNOWN — the gateway's path predicates set no handler pattern;
# the fallback shows as /fallback/{service}). spring.cloud.gateway.requests, the per-route
# timer, is not published: its auto-configuration requires Micrometer Tracing, which the
# gateway does not carry.
management.metrics.distribution.slo.http.server.requests=50ms,100ms,250ms,500ms,1s,2500ms,5s
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Splits health into the two groups Kubernetes probes use:
#   liveness  — is the process broken beyond recovery?
#   readiness — should it receive traffic?
# Neither includes the database or broker indicators, and that is deliberate: a
# datastore blip would otherwise mark every pod NotReady at once, pulling the
# whole service out of the load balancer instead of degrading.
management.endpoint.health.probes.enabled=true

# The probes stay on the main port, at /livez and /readyz, where the manifests point them: the
# health groups are served there too ("server:" additional paths), whatever port actuator uses.
# Boot only accepts single-segment paths here.
#
# Configuring a group by name turns it into a user-defined group, which includes EVERY health
# indicator unless told otherwise — Redis among them, so a Redis outage would fail liveness and
# restart the pods. The includes below pin each group back to the probe state Boot gives it.
management.endpoint.health.group.liveness.include=livenessState
management.endpoint.health.group.liveness.additional-path=server:/livez
management.endpoint.health.group.readiness.include=readinessState
management.endpoint.health.group.readiness.additional-path=server:/readyz

# --- API documentation ------------------------------------------------------
# Off unless switched on, and the only service configured that way. The four services
# behind this one are ClusterIP: their /v3/api-docs is unreachable from outside the
# cluster by construction, so it stays on. This process is the one the tunnel reaches,
# and the tunnel's path rules live in Cloudflare rather than in this repository — so
# "not routed publicly" is an assumption here, not something the manifests guarantee.
# The dev and local overlays set SPRINGDOC_ENABLED=true; prod leaves it off.
springdoc.api-docs.enabled=${SPRINGDOC_ENABLED:false}
springdoc.swagger-ui.enabled=${SPRINGDOC_ENABLED:false}

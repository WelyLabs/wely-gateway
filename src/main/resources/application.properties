spring.application.name=gateway
server.port=8081

# Production/Base configuration (values injected by Kube or env)
spring.security.oauth2.resourceserver.jwt.issuer-uri=${KEYCLOAK_ISSUER_URI}
spring.security.oauth2.resourceserver.jwt.jwk-set-uri=${KEYCLOAK_INTERNAL_JWK_SET_URI}
users.api.url=${USERS_API_URL}
social.api.url=${SOCIAL_API_URL}
chat.api.url=${CHAT_API_URL}
chat.rsocket.url=${CHAT_RSOCKET_URL}
media.api.url=${MEDIA_API_URL}
events.api.url=${EVENTS_API_URL}

# CORS allowed origin (injected by environment)
cors.allowed.origin=${CORS_ALLOWED_ORIGIN:https://web.welylabs.app}

# Production levels. The DEBUG settings that used to live here logged every request
# the gateway proxied, headers included, at a cost paid on every call. Raise them
# temporarily through an environment variable when a route needs investigating:
#   LOGGING_LEVEL_ORG_SPRINGFRAMEWORK_CLOUD_GATEWAY=DEBUG
logging.level.root=INFO
logging.level.com.calendar.gateway=INFO
logging.level.reactor.netty=WARN
logging.level.org.springframework.cloud.gateway=INFO

# --- Actuator ---------------------------------------------------------------
# Only health and info are exposed. Everything else — env, beans, heapdump,
# loggers — stays off: those endpoints describe the internals and, on a cluster
# without a NetworkPolicy, anything inside can reach them.
management.endpoints.web.exposure.include=health,info
management.endpoint.health.show-details=never
management.endpoint.health.show-components=never

# Splits health into the two groups Kubernetes probes use:
#   /actuator/health/liveness  — is the process broken beyond recovery?
#   /actuator/health/readiness — should it receive traffic?
# Neither includes the database or broker indicators, and that is deliberate: a
# datastore blip would otherwise mark every pod NotReady at once, pulling the
# whole service out of the load balancer instead of degrading.
management.endpoint.health.probes.enabled=true
